name: Native core and terminal lifecycle

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }} / Rust 1.90.0
    # Labels are native hosts, not cross-compilation or WSL:
    # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
            os: Darwin
            arch: arm64
          - name: macos-x86_64
            runner: macos-15-intel
            os: Darwin
            arch: x86_64
          - name: linux-x86_64
            runner: ubuntu-22.04
            os: Linux
            arch: x86_64
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            os: Linux
            arch: arm64
          - name: windows-x86_64
            runner: windows-2022
            os: Windows
            arch: x86_64
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      NATIVE_EXPECT_OS: ${{ matrix.os }}
      NATIVE_EXPECT_ARCH: ${{ matrix.arch }}
      NATIVE_RUNNER_LABEL: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.9'
      - name: Install pinned toolchain and terminal emulator
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          python -m pip install pyte==0.8.2 wcwidth==0.2.13
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python -m pip install pywinpty==2.0.15
          fi
      - name: Record observed native host and versions
        run: python scripts/terminal_smoke.py --record-host --output target/native-smoke
      - name: Check formatting
        run: cargo fmt --all -- --check 2>&1 | tee target/native-smoke/fmt.log
      - name: Test locked dependencies
        run: cargo test --locked --all-targets 2>&1 | tee target/native-smoke/test.log
      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee target/native-smoke/clippy.log
      - name: Build native release
        run: cargo build --release --locked 2>&1 | tee target/native-smoke/release.log
      - name: Exercise actual native terminal and lifecycle
        run: python scripts/terminal_smoke.py --binary target/release/eevee --output target/native-smoke
      - name: Upload observed evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-${{ matrix.name }}
          path: |
            target/native-smoke/*.json
            target/native-smoke/*.log
            target/native-smoke/**/*.ansi
            target/native-smoke/**/*.txt
            target/native-smoke/**/*.json
          if-no-files-found: warn
          retention-days: 14
