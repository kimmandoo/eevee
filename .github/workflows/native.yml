name: Native core and terminal lifecycle

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Exhaustive shared behavior runs once; OS rendering and native file/install
  # boundaries keep explicit coverage on every supported target.
  check:
    name: Check
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.9'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test release qualification scripts
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify SDK policy without account login or model calls
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix sidecar
          npm test --prefix sidecar

  native:
    name: Build / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-14, target: aarch64-apple-darwin, package: darwin-arm64, profile: macos }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, package: darwin-x86_64, profile: architecture }
          - { name: linux-x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, package: linux-x86_64, profile: full }
          - { name: linux-arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, package: linux-arm64, profile: architecture }
          - { name: windows-x86_64, runner: windows-2022, target: x86_64-pc-windows-msvc, package: windows-x86_64, profile: windows }
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
      CARGO_TERM_COLOR: never
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.9'
      - name: Install pinned toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            printf '%s\n' 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}-cargo-about-0.9.2
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test locked dependencies
        run: cargo test --locked --all-targets
      - name: Build native release
        run: cargo build --release --locked
      - name: Generate native dependency notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about generate --locked --fail --format json --target "${{ matrix.target }}" --output-file target/native-licenses.json
          python scripts/license_notices.py --report target/native-licenses.json --output target/THIRD_PARTY_NOTICES
      - name: Package the standalone native executable
        run: python scripts/package_binary.py --binary target/release/ev --notices target/THIRD_PARTY_NOTICES --output target/packages
      - name: Install the package offline and run it
        shell: python
        run: |
          import os, pathlib, subprocess
          packages = pathlib.Path("target/packages").resolve()
          dest = pathlib.Path(os.environ["RUNNER_TEMP"], "ev install", "bin")
          if os.name == "nt":
              archive = packages / "ev-${{ matrix.package }}.zip"
              command = ["powershell.exe", "-NoProfile", "-NonInteractive", "-File", "install.ps1",
                         "-Archive", archive, "-Checksums", packages / "SHA256SUMS", "-InstallDir", dest, "-NoAnimation"]
          else:
              archive = packages / "ev-${{ matrix.package }}.tar.gz"
              command = ["sh", "install.sh", "--archive", archive,
                         "--checksums", packages / "SHA256SUMS", "--install-dir", dest, "--no-animation"]
          subprocess.run([str(part) for part in command], check=True, timeout=120)
          binary = dest / ("ev.exe" if os.name == "nt" else "ev")
          subprocess.run([str(binary), "--version"], check=True, timeout=30)
      - name: Install terminal smoke dependencies
        run: python -m pip install pyte==0.8.2 wcwidth==0.2.13
      - name: Exercise native console capture regressions
        run: python -m unittest discover -s scripts -p test_windows_conpty.py
      - name: Isolate current-run terminal evidence from compiler caches
        run: printf 'NATIVE_SMOKE_OUTPUT=%s/ev-native-workflows/%s-%s\n' "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Exercise qualified native coverage profile
        run: |
          python scripts/native_workflows_smoke.py \
            --binary target/release/ev${{ runner.os == 'Windows' && '.exe' || '' }} \
            --output "$NATIVE_SMOKE_OUTPUT" --profile "${{ matrix.profile }}" --jobs 2
      - name: Retain platform file workflow evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: file-workflows-${{ matrix.package }}
          path: |
            ${{ env.NATIVE_SMOKE_OUTPUT }}/
          if-no-files-found: error
          retention-days: 14
      - name: Upload native installation package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ev-${{ matrix.package }}
          path: target/packages/*
          if-no-files-found: error
          retention-days: 14
