<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Eevee sanctuary — planned terminal composition</title>
  <desc id="description">Design illustration, not a runtime screenshot. The portrait well is reserved for actual Eevee artwork loaded from a local source-tracked image, not a hand-drawn motif. The SVG intentionally embeds no franchise bytes. One task card and next action occupy the center; context, connection, and permission details live in the inspector. All sample task content is illustrative.</desc>
  <style>
    text { font-family: ui-monospace, monospace; font-size: 14px; fill: var(--fg, currentColor); }
    .muted { fill: var(--muted, currentColor); }
    .accent { fill: var(--accent, currentColor); }
    .label { font-size: 12px; letter-spacing: 1px; }
    .line { stroke: var(--border, currentColor); }
    .focus { stroke: var(--accent, currentColor); }
  </style>
  <text x="20" y="24" class="accent">eevee / sanctuary</text>
  <text x="540" y="24" class="muted label">PLANNED UI · ILLUSTRATIVE CONTENT</text>

  <rect x="16" y="44" width="928" height="496" rx="12" class="line"/>
  <text x="34" y="74">Fix configuration reload</text>
  <text x="710" y="74" class="accent">EEVEE · READY</text>
  <text x="34" y="96" class="muted">One task. One partner. Choose the tools you need.</text>
  <path d="M32 112H928" class="line"/>

  <rect x="32" y="128" width="172" height="356" rx="8" class="line"/>
  <text x="55" y="153" class="muted label">YOUR COMPANION</text>
  <g id="artwork-well">
    <rect x="46" y="174" width="144" height="144" rx="6" class="line" stroke-dasharray="3 4"/>
    <text x="66" y="226" class="accent">ACTUAL EEVEE</text>
    <text x="66" y="249" class="muted">PNG artwork</text>
    <text x="61" y="274" class="muted label">CONTAIN / ALPHA</text>
    <text x="62" y="299" class="muted label">NOT ASCII ART</text>
  </g>
  <text x="94" y="333" class="accent">Eevee</text>
  <text x="90" y="354" class="muted">Normal</text>
  <text x="50" y="389">Scope &amp; routing</text>
  <text x="50" y="434" class="muted">Same task.</text>
  <text x="50" y="454" class="muted">Different tools.</text>

  <rect x="220" y="128" width="464" height="356" rx="8" class="focus"/>
  <text x="240" y="153" class="accent label">TASK / DRAFT</text>
  <text x="240" y="186">Keep the last valid configuration</text>
  <text x="240" y="208">when a reload fails.</text>
  <text x="240" y="243" class="muted label">DONE WHEN</text>
  <text x="240" y="270">[ ] Invalid reload preserves active config.</text>
  <text x="240" y="294">[ ] Valid reload replaces it.</text>
  <path d="M240 315H664" class="line"/>
  <text x="240" y="342" class="muted label">NEXT ACTION</text>
  <text x="240" y="369" class="accent">Vaporeon / inspect the reload path</text>
  <text x="240" y="394" class="muted">Choose relevant sources before a request.</text>
  <rect x="240" y="418" width="248" height="40" rx="5" class="focus"/>
  <text x="255" y="443" class="accent">f  Choose evolution</text>
  <text x="505" y="443" class="muted">Local action</text>

  <rect x="700" y="128" width="228" height="356" rx="8" class="line"/>
  <text x="718" y="153" class="muted label">SESSION INSPECTOR</text>
  <text x="718" y="189">Selected context</text>
  <text x="718" y="213" class="muted">No source ranges</text>
  <text x="718" y="233" class="muted">pinned yet.</text>
  <text x="718" y="278">Provider</text>
  <text x="718" y="302" class="muted">Not connected</text>
  <text x="718" y="347">Permissions</text>
  <text x="718" y="371" class="muted">No grants</text>
  <text x="718" y="423" class="muted">Form selection does</text>
  <text x="718" y="443" class="muted">not start a request.</text>

  <path d="M32 500H928" class="line"/>
  <text x="34" y="524" class="muted">Tab Focus</text>
  <text x="192" y="524" class="muted">Ctrl+K Actions</text>
  <text x="410" y="524" class="muted">i Inspect</text>
  <text x="614" y="524" class="muted">? Help</text>
  <text x="808" y="524" class="muted">q Quit</text>
</svg>
