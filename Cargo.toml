[package]
name = "eevee"
version = "0.1.13"
edition = "2024"
rust-version = "1.90"
description = "A local-first evolution workbench for LLM-assisted development"
publish = false
license = "Apache-2.0"

[[bin]]
name = "ev"
path = "src/main.rs"

[dependencies]
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "unstable-rendered-line-info"] }
crossterm = "=0.29.0"
unicode-segmentation = "=1.13.3"
unicode-normalization = "=0.1.25"
ratatui-image = { version = "=11.0.0", default-features = false }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
base64-simd = "=0.8.0"
getrandom = "=0.2.17"
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=0.9.11"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "json", "hickory-dns"] }
tokio = { version = "=1.50.0", features = ["rt", "time", "net"] }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
parking_lot = "=0.12.5"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.182"
signal-hook = "=0.3.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

# Runner tests hash the >100 MiB debug test executable; unoptimized SHA-256 made admission
# exceed bounded deadlines on loaded macOS runners.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
